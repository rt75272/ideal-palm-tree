[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A Large Language Model built from scratch using Python and NumPy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # NumPy is the only external dependency — used purely for efficient array
    # math.  No ML frameworks (PyTorch / TensorFlow / JAX) are used.
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Install with: uv sync --extra gpu
# Note: choose the CuPy wheel matching your CUDA runtime.
gpu = [
    "cupy-cuda12x>=13.0.0",
]

# Install with: uv sync --extra torch
# Note: select/override the wheel source as needed for your CUDA or CPU target.
torch = [
    "torch>=2.5.0",
]

[project.scripts]
# Train the model on the bundled conversation dataset.
llm-train = "llm.trainer:main"
# Train the model with PyTorch on CUDA.
llm-train-torch = "llm.torch_trainer:main"
# Chat with a PyTorch-trained checkpoint.
llm-chat-torch = "llm.torch_chat:main"
# Start an interactive chat session.
llm-chat = "llm.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.uv]
# (uv project metadata — dependencies are in [dependency-groups])

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
